name: CI/CD Pipeline

on:
  push:
    branches:
      - joseCastro_p1_base

env:
   DOTNET_TOOLS_PATH: ./tools
   NUGET_PATH: ./tools/nuget-packages

jobs:
  ci-cd:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build TrainProject.sln

      - name: Install JetBrains ReSharper tools
        run: |
          dotnet tool install JetBrains.ReSharper.GlobalTools --tool-path ./tools

      - name: Run code inspection
        run: |
          mkdir "myApp\reports"
          ./tools/jb.exe inspectcode TrainProject.sln -o="myApp/reports/report.xml" -f="xml"

      - name: Validate report
        run: |
          cd scripts
          pwsh ./validate_report.ps1

      - name: Install coverage tools
        run: |
          cd myApp.Tests
          mkdir reports
          dotnet add package coverlet.msbuild --package-directory ../${{ env.NUGET_PATH }}

      - name: Run unit tests with coverage
        run: |
          cd myApp.Tests
          dotnet test -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=reports/coverage

      - name: Validate coverage
        run: |
          cd scripts
          pwsh ./validate_coverage.ps1

      - name: Generate HTML coverage report
        run: |
          cd myApp.Tests
          dotnet tool install dotnet-reportgenerator-globaltool --tool-path ../${{ env.DOTNET_TOOLS_PATH }}
          ../${{ env.DOTNET_TOOLS_PATH }}/reportgenerator -reports:reports/coverage.cobertura.xml -targetdir:reports/coveragereport -reporttypes:Html

      - name: Publish app
        run: |
          dotnet publish myApp/myApp.csproj -c Release -o ./publish

      - name: Deploy to runner host (optional)
        run: |
          mkdir deployments\myApp
          xcopy .\publish\* deployments\myApp\ /E /Y