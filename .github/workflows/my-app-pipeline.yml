name: CI/CD Pipeline

on:
  push:
    branches:
      - joseCastro_p1_base

env:
  DOTNET_TOOLS_PATH: "./tools"
  NUGET_PATH: "./packages"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

  test:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install JetBrains ReSharper tools
        run: |
          mkdir -p $HOME/.dotnet/tools
          dotnet tool install JetBrains.ReSharper.GlobalTools --tool-path DOTNET_TOOLS_PATH
        
      - name: Run code inspection
        run: |
          mkdir -p myApp/reports
          $HOME/.dotnet/tools/jb inspectcode ./TrainProject.sln -o=myApp/reports/report.xml

      - name: Validate report
        run: |
          cd scripts
          pwsh ./validate_report.ps1

      - name: Install coverage tools
        run: |
          cd myApp.Tests
          mkdir -p reports
          dotnet add package coverlet.msbuild --package-directory $NUGET_PATH

      - name: Run unit tests with coverage
        run: |
          cd myApp.Tests
          dotnet test -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=reports/coverage

      - name: Validate coverage
        run: |
          cd scripts
          pwsh ./validate_coverage.ps1

      - name: Generate HTML coverage report
        run: |
          cd myApp.Tests
          dotnet tool install dotnet-reportgenerator-globaltool --tool-path DOTNET_TOOLS_PATH
          $HOME/.dotnet/tools/reportgenerator -reports:reports/coverage.cobertura.xml -targetdir:reports/coveragereport -reporttypes:Html

  publish:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish app
        run: |
          dotnet publish myApp/myApp.csproj -c Release -o ./publish

  deploy-dev:
    needs: publish
    runs-on: self-hosted
    steps:
      - name: Deploy to runner host
        run: |
          mkdir -p $HOME/deployments/myApp
          
          cp -r ./publish/* $HOME/deployments/myApp/
          
          chmod +x $HOME/deployments/myApp/myApp
          
          echo "Aplication deployed: $HOME/deployments/myApp"